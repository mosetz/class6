<!DOCTYPE html>
<html>

<head>

<script>
	function addOne() {
		const num = document.getElementById("num");
		const realNum = Number(num.value);
		num.value = realNum + 1;
	}

	function subtractOne() {
		const num = document.getElementById("num");
		const realNum = Number(num.value);
		num.value = realNum - 1;
	}
</script>

</head>

<body>

	<form>
		<label for="num">Number</label>
		<input type="text" id="num" name="num"><br><br>
	</form>

	<button onclick="addOne(num);">Add One</button>
	<button onclick="subtractOne(num);">Subtract One</button>

</body>
</html>
